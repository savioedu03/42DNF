<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>42 DNF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #container {
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="game"></canvas>
  </div>
  <script>
  function mostrarErroNaTela(titulo, detalhe) {
    const canvas = document.getElementById('game');
    if (!canvas) return;
    canvas.width = 1280;
    canvas.height = 720;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f00';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const msg = titulo + '\n\n' + detalhe;
    const linhas = msg.split('\n');
    for (let i = 0; i < linhas.length && i < 26; i++) {
      ctx.fillText(linhas[i].substring(0, 65), 20, 30 + i * 26);
    }
  }

  window.addEventListener('error', (e) => {
    mostrarErroNaTela('ERRO GERAL', e.message + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
  });

  window.addEventListener('unhandledrejection', (e) => {
    mostrarErroNaTela('PROMESSA NAO TRATADA', (e.reason && e.reason.message) || String(e.reason));
  });

  window.addEventListener('load', () => {
    import('./src/main.js')
      .then((mod) => mod.iniciarJogo())
      .catch((err) => {
        mostrarErroNaTela('ERRO NO IMPORT', err.message + '\n\n' + (err.stack || ''));
      });
  });
</script>
</body>
</html>
