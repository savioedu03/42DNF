<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>42 DNF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #container {
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="game"></canvas>
  </div>
  <script type="module">
    const canvas = document.getElementById('game');
    canvas.width = 1280;
    canvas.height = 720;
    const ctx = canvas.getContext('2d');

    function limpar() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function escrever(txt, cor = '#0f0') {
      ctx.fillStyle = cor;
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const linhas = String(txt).split('\n');
      for (let i = 0; i < linhas.length && i < 30; i++) {
        ctx.fillText(linhas[i].substring(0, 70), 20, 30 + i * 26);
      }
    }

    const arquivos = [
      './src/config.js',
      './src/paleta.js',
      './src/player_m_baixo.js',
      './src/player_m_cima.js',
      './src/player_m_lado.js',
      './src/player_f_baixo.js',
      './src/player_f_cima.js',
      './src/player_f_lado.js',
      './src/player.js',
      './src/input.js',
      './src/colisao.js',
      './src/main.js',
    ];

    (async () => {
      let y = 30;
      for (const arq of arquivos) {
        try {
          await import(arq);
          ctx.fillStyle = '#0f0';
          ctx.font = 'bold 20px monospace';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('OK   ' + arq, 20, y);
          y += 26;
        } catch (e) {
          ctx.fillStyle = '#f00';
          ctx.font = 'bold 20px monospace';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('X    ' + arq, 20, y);
          y += 26;
          ctx.fillText('     ' + e.message, 20, y);
          y += 26;
          ctx.fillText('     ' + (e.stack || '').substring(0, 70), 20, y);
          y += 40;
        }
      }
    })();
  </script>
</body>
</html>
